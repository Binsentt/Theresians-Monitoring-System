[build]
builder = "NIXPACKS"
buildCommand = "npm run build && npm --prefix backend ci --omit=dev"

[build.nixpacks]
nodeVersion = "20"

[deploy]
preDeployCommand = ["RELEASE_MIGRATIONS_APPROVED=true npm --prefix backend run migrate:release && QA_ADMIN_BOOTSTRAP_APPROVED=true NODE_ENV=qa node backend/scripts/bootstrap-qa-admin.js"]
startCommand = "npm --prefix backend start"
