name: Isolated backend regression

on:
  push:
    branches:
      - codex/student-progress-child-progress-ai-refresh-20261031
      - main
    paths:
      - '.github/workflows/backend-network-isolated.yml'
      - 'capstone/backend/**'
      - 'capstone/src/components/activityLog.utils.js'
      - 'capstone/src/components/activityLog.utils.test.js'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/backend-network-isolated.yml'
      - 'capstone/backend/**'
      - 'capstone/src/components/activityLog.utils.js'
      - 'capstone/src/components/activityLog.utils.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-network-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/student-progress-child-progress-ai-refresh-20261031' || github.ref == 'refs/heads/codex/read-only-startup-schema-safety-20261105' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'

    steps:
      - name: Check out candidate without persisting credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 20 on the GitHub-hosted runner
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify runner tools and prevent dotenv files entering the container
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --version | grep -Eq '^v20\.'
          docker version
          docker info --format 'Docker server {{.ServerVersion}}'
          for candidate in capstone/.env capstone/backend/.env; do
            if [[ -f "$candidate" ]]; then
              echo "::error::Unexpected dotenv file in clean checkout: $candidate"
              exit 1
            fi
          done

      - name: Prepare isolated dependency and log directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tq-backend-dependencies" "$RUNNER_TEMP/tq-backend-npm-cache" "$RUNNER_TEMP/tq-backend-test-uploads/.test-tmp" "$RUNNER_TEMP/tq-backend-logs" "$RUNNER_TEMP/tq-backend-logs/backend-file-tests"
          cp capstone/backend/package.json capstone/backend/package-lock.json "$RUNNER_TEMP/tq-backend-dependencies/"
          chmod -R u+rwX "$RUNNER_TEMP/tq-backend-test-uploads"
          chmod 0755 "$RUNNER_TEMP/tq-backend-dependencies" "$RUNNER_TEMP/tq-backend-npm-cache" "$RUNNER_TEMP/tq-backend-test-uploads" "$RUNNER_TEMP/tq-backend-logs" "$RUNNER_TEMP/tq-backend-logs/backend-file-tests"
          git ls-files -- capstone/backend | grep -E '(^|/)([^/]+\.(test|spec)\.(js|mjs|cjs)|test-[^/]+\.(js|mjs|cjs)|tests?/.+\.(js|mjs|cjs)|__tests__/.+\.(js|mjs|cjs))$' | sed 's#^capstone/backend/##' | sort -u > "$RUNNER_TEMP/tq-backend-logs/backend-test-files.txt"
          test_file_count="$(wc -l < "$RUNNER_TEMP/tq-backend-logs/backend-test-files.txt")"
          test "$test_file_count" -gt 0
          echo "Tracked backend test files: $test_file_count"
          cat "$RUNNER_TEMP/tq-backend-logs/backend-test-files.txt"

      - name: Prepare bounded per-file runner and Parent PostgreSQL route probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/tq-backend-logs/backend-file-runner.sh" <<'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          node -e '
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const uploadsDir = path.join(process.cwd(), "uploads");
          const testTempDir = path.join(uploadsDir, ".test-tmp");
          for (const name of ["TMPDIR", "TMP", "TEMP"]) {
            assert.equal(process.env[name], testTempDir, `${name} must use synthetic uploads storage`);
          }
          assert.equal(os.tmpdir(), testTempDir, "Node temporary directory must be the synthetic test directory");
          assert.equal(fs.statSync(testTempDir).dev, fs.statSync(uploadsDir).dev,
            "temporary sources and upload destinations must share a filesystem");
          fs.accessSync(testTempDir, fs.constants.W_OK);
          fs.accessSync(uploadsDir, fs.constants.W_OK);
          console.log("Upload filesystem preflight passed: Node temp and synthetic uploads are writable on the same filesystem.");
          '
          status_file=/test-logs/backend-file-status.tsv
          printf 'test_file\tresult\texit_code\n' > "$status_file"
          overall_status=0
          while IFS= read -r test_file; do
            [[ -n "$test_file" ]] || continue
            report_name="$(printf '%s' "$test_file" | tr '/' '_').tap"
            report_path="/test-logs/backend-file-tests/$report_name"
            echo "::group::Backend test file: $test_file"
            echo "START test_file=$test_file at=$(date -u +%Y-%m-%dT%H:%M:%SZ) per_file_limit=30s"
            set +e
            timeout --signal=TERM --kill-after=5s 30s \
              node --test --test-reporter=tap "$test_file" 2>&1 | tee "$report_path"
            test_status=$?
            set -e
            if [[ "$test_status" -eq 0 ]]; then
              result=passed
            elif [[ "$test_status" -eq 124 ]]; then
              result=timed_out
              overall_status=1
            else
              result=failed
              overall_status=1
            fi
            echo "END test_file=$test_file result=$result exit_code=$test_status at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\t%s\t%s\n' "$test_file" "$result" "$test_status" >> "$status_file"
            echo "::endgroup::"
          done < /test-logs/backend-test-files.txt
          echo "Full test-file runner exit_code=$overall_status"
          exit "$overall_status"
          RUNNER
          chmod 0644 "$RUNNER_TEMP/tq-backend-logs/backend-file-runner.sh"

          cat > "$RUNNER_TEMP/tq-backend-logs/parent-route-postgres.integration.cjs" <<'PARENT_TEST'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const jwt = require('jsonwebtoken');
          const { Pool } = require('pg');
          const { applySyntheticTestSchema } = require('/workspace/capstone/backend/testSupport/applySyntheticTestSchema');
          const {
            assertDisposablePostgresUrl,
            assertDisposablePostgresDatabase,
          } = require('/workspace/capstone/backend/testSafety/disposablePostgres');

          const databaseUrl = process.env.DATABASE_URL;
          assertDisposablePostgresUrl({
            connectionString: databaseUrl,
            expectedDatabaseName: 'tq_parent_route_test_ci',
          });
          const parsedDatabaseUrl = new URL(databaseUrl || '');
          assert.equal(parsedDatabaseUrl.hostname, '127.0.0.1', 'Parent route probe must use loopback PostgreSQL');
          assert.equal(parsedDatabaseUrl.pathname, '/tq_parent_route_test_ci', 'Parent route probe must use its disposable database');
          assert.equal(process.env.AI_RUNTIME_ENABLED, 'false');
          assert.equal(process.env.AI_GENERATION_ENABLED, 'false');

          const tokenFor = (accountId, role) => jwt.sign(
            { userId: accountId, role, sessionVersion: 0 },
            process.env.JWT_SECRET,
            { expiresIn: '5m' },
          );

          async function main() {
            const bootstrap = new Pool({ connectionString: databaseUrl });
            try {
              await applySyntheticTestSchema(bootstrap, databaseUrl);
              await assertDisposablePostgresDatabase({
                client: bootstrap,
                connectionString: databaseUrl,
                expectedDatabaseName: 'tq_parent_route_test_ci',
              });
            } finally {
              await bootstrap.end();
            }

            const backendRoot = '/workspace/capstone/backend';
            const { app, schemaReady } = require(backendRoot + '/server');
            const pool = require(backendRoot + '/database/db');
            let httpServer = null;
            try {
              await schemaReady;
              await assertDisposablePostgresDatabase({
                client: pool,
                connectionString: databaseUrl,
                expectedDatabaseName: 'tq_parent_route_test_ci',
              });
              await pool.query(fs.readFileSync(
                backendRoot + '/migrations/012_add_activity_log_event_idempotency.sql',
                'utf8',
              ));
              const { applyReleaseMigrations } = require(backendRoot + '/releaseMigrations');
              await applyReleaseMigrations({ client: pool });
              await assertDisposablePostgresDatabase({
                client: pool,
                connectionString: databaseUrl,
                expectedDatabaseName: 'tq_parent_route_test_ci',
              });
              await pool.query('TRUNCATE public.accounts RESTART IDENTITY CASCADE');

              const parentResult = await pool.query([
                'INSERT INTO public.accounts (name, email, password, role, status, is_archived, session_version, parent_id)',
                'VALUES (\'CI Parent One\', \'parent-one@example.test\', \'unused\', \'parent\', \'active\', false, 0, \'902341\')',
                'RETURNING id',
              ].join('\n'));
              const otherParentResult = await pool.query([
                'INSERT INTO public.accounts (name, email, password, role, status, is_archived, session_version, parent_id)',
                'VALUES (\'CI Parent Two\', \'parent-two@example.test\', \'unused\', \'parent\', \'active\', false, 0, \'902342\')',
                'RETURNING id',
              ].join('\n'));
              const cycleStartedAt = new Date(Date.now() - 120000);
              const studentResult = await pool.query([
                'INSERT INTO public.accounts',
                '(name, email, password, role, status, is_archived, session_version, game_student_id,',
                ' grade_level, section, current_learning_cycle_version, current_learning_cycle_started_at)',
                'VALUES (\'CI Linked Student\', \'student-one@example.test\', \'unused\', \'student\', \'active\', false, 0,',
                '        \'24000001\', \'Grade 1\', \'Section A\', 1, $1)',
                'RETURNING id',
              ].join('\n'), [cycleStartedAt.toISOString()]);
              const otherStudentResult = await pool.query([
                'INSERT INTO public.accounts',
                '(name, email, password, role, status, is_archived, session_version, game_student_id, grade_level, section)',
                'VALUES (\'CI Unlinked Student\', \'student-two@example.test\', \'unused\', \'student\', \'active\', false, 0,',
                '        \'24000002\', \'Grade 1\', \'Section A\')',
                'RETURNING id',
              ].join('\n'));
              const parentId = Number(parentResult.rows[0].id);
              const otherParentId = Number(otherParentResult.rows[0].id);
              const studentId = Number(studentResult.rows[0].id);
              const otherStudentId = Number(otherStudentResult.rows[0].id);
              await pool.query(
                'INSERT INTO public.teacher_student_relationships (teacher_id, student_id, relationship_type) VALUES ($1, $2, \'Parent\')',
                [parentId, studentId],
              );

              const oldSession = await pool.query([
                'INSERT INTO public.playtime_sessions',
                '(student_id, parent_id, student_name, grade_level, section, start_time, end_time, status, learning_cycle_version)',
                'VALUES ($1, \'902341\', \'CI Linked Student\', \'Grade 1\', \'Section A\', $2, $3, \'Offline\', 0)',
                'RETURNING id',
              ].join('\n'), [
                studentId,
                new Date(cycleStartedAt.getTime() - 120000).toISOString(),
                new Date(cycleStartedAt.getTime() - 60000).toISOString(),
              ]);
              const currentSession = await pool.query([
                'INSERT INTO public.playtime_sessions',
                '(student_id, parent_id, student_name, grade_level, section, start_time, status, learning_cycle_version)',
                'VALUES ($1, \'902341\', \'CI Linked Student\', \'Grade 1\', \'Section A\', $2, \'Playing\', 1)',
                'RETURNING id',
              ].join('\n'), [studentId, new Date(cycleStartedAt.getTime() + 5000).toISOString()]);

              const insertResult = async ({ sessionId, playedAt, score, eventId }) => pool.query([
                'INSERT INTO public.game_results',
                '(parent_id, student_name, resolved_student_id, grade_level, difficulty, math_topic,',
                ' score, total_items, percentage, played_at, playtime_session_id, result_event_id, is_unlinked)',
                'VALUES (\'902341\', \'CI Linked Student\', $1, \'Grade 1\', \'Easy\', \'Addition\',',
                '        $2, 4, $3, $4, $5, $6, false)',
              ].join('\n'), [studentId, score, score * 25, playedAt, sessionId, eventId]);
              await insertResult({
                sessionId: Number(oldSession.rows[0].id),
                playedAt: new Date(cycleStartedAt.getTime() - 30000).toISOString(),
                score: 1,
                eventId: 'parent-cycle-old',
              });
              await insertResult({
                sessionId: Number(oldSession.rows[0].id),
                playedAt: new Date(cycleStartedAt.getTime() + 10000).toISOString(),
                score: 2,
                eventId: 'parent-cycle-mismatch',
              });
              await insertResult({
                sessionId: Number(currentSession.rows[0].id),
                playedAt: new Date(cycleStartedAt.getTime() + 20000).toISOString(),
                score: 3,
                eventId: 'parent-cycle-current',
              });

              httpServer = await new Promise((resolve, reject) => {
                const server = app.listen(0, '127.0.0.1', () => resolve(server));
                server.once('error', reject);
              });
              const baseUrl = 'http://127.0.0.1:' + httpServer.address().port;
              const fetchHistory = async (accountId, role, targetStudentId) => {
                const response = await fetch(
                  baseUrl + '/api/parent/children/' + targetStudentId + '/quizzes?page=1&limit=20',
                  { headers: { Authorization: 'Bearer ' + tokenFor(accountId, role) } },
                );
                return { status: response.status, body: await response.json() };
              };

              const linkedResponse = await fetchHistory(parentId, 'parent', studentId);
              assert.equal(linkedResponse.status, 200, JSON.stringify(linkedResponse.body));
              assert.equal(linkedResponse.body.pagination.total, 1);
              assert.equal(linkedResponse.body.data.length, 1);
              assert.equal(Number(linkedResponse.body.data[0].score), 3);
              assert.equal(Number(linkedResponse.body.data[0].total_items), 4);
              assert.equal(linkedResponse.body.history_verification.cycle_checked, true);
              assert.equal(linkedResponse.body.history_verification.excluded_unverifiable_count, 1);
              assert.equal(linkedResponse.body.history_verification.excluded_invalid_score_count, 0);

              const unrelatedParentResponse = await fetchHistory(otherParentId, 'parent', studentId);
              assert.equal(unrelatedParentResponse.status, 403, JSON.stringify(unrelatedParentResponse.body));
              const studentRoleResponse = await fetchHistory(otherStudentId, 'student', studentId);
              assert.equal(studentRoleResponse.status, 403, JSON.stringify(studentRoleResponse.body));

              const storedResults = await pool.query(
                'SELECT COUNT(*)::INTEGER AS count FROM public.game_results WHERE resolved_student_id = $1',
                [studentId],
              );
              assert.equal(storedResults.rows[0].count, 3);
              assert.ok(otherStudentId > 0);
              console.log('PASS: Parent quiz-history route executed real PostgreSQL queries, returned only the linked current-cycle result, and denied unrelated Parent and Student-role access.');
              console.log('Synthetic test records only; disposable target is loopback tq_parent_route_test_ci.');
            } finally {
              if (httpServer) {
                httpServer.closeAllConnections?.();
                await new Promise((resolve) => httpServer.close(() => resolve()));
              }
              await pool.end();
            }
          }

          main().catch((error) => {
            console.error(error.stack || error.message);
            process.exitCode = 1;
          });
          PARENT_TEST
          chmod 0644 "$RUNNER_TEMP/tq-backend-logs/backend-file-runner.sh" "$RUNNER_TEMP/tq-backend-logs/parent-route-postgres.integration.cjs"

      - name: Pull Node 20 and disposable PostgreSQL images during preparation
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:20-bookworm
          docker pull postgres:16-bookworm

      - name: Install backend dependencies from the committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --network bridge \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --volume "$RUNNER_TEMP/tq-backend-dependencies:/workspace" \
            --volume "$RUNNER_TEMP/tq-backend-npm-cache:/npm-cache" \
            --env HOME=/tmp/home \
            --env npm_config_cache=/npm-cache \
            --workdir /workspace \
            node:20-bookworm npm ci --no-audit --no-fund \
            > "$RUNNER_TEMP/tq-backend-logs/npm-ci.log" 2>&1
          install_status=$?
          set -e
          cat "$RUNNER_TEMP/tq-backend-logs/npm-ci.log"
          if [[ "$install_status" -ne 0 ]]; then
            exit "$install_status"
          fi
          test -d "$RUNNER_TEMP/tq-backend-dependencies/node_modules"

      - name: Start an ephemeral PostgreSQL database with no network
        id: start-postgres
        shell: bash
        run: |
          set -euo pipefail
          postgres_uid="$(docker run --rm --network none postgres:16-bookworm id -u postgres)"
          postgres_gid="$(docker run --rm --network none postgres:16-bookworm id -g postgres)"
          docker run --detach \
            --name tq-backend-test-postgres \
            --network none \
            --user "${postgres_uid}:${postgres_gid}" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --shm-size=256m \
            --tmpfs "/var/lib/postgresql/data:rw,nosuid,nodev,size=1g,uid=${postgres_uid},gid=${postgres_gid},mode=0700" \
            --tmpfs "/var/run/postgresql:rw,nosuid,nodev,size=64m,uid=${postgres_uid},gid=${postgres_gid},mode=3775" \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-bookworm
          ready=false
          for attempt in $(seq 1 60); do
            container_state="$(docker inspect --format='{{.State.Status}}' tq-backend-test-postgres 2>/dev/null || true)"
            if [[ "$container_state" != running && "$container_state" != created ]]; then
              echo "PostgreSQL container stopped before readiness (state=${container_state:-missing})."
              docker inspect --format='exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' tq-backend-test-postgres || true
              docker logs tq-backend-test-postgres || true
              exit 1
            fi
            if docker exec tq-backend-test-postgres pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs tq-backend-test-postgres
            exit 1
          fi
          for database in \
            tq_backend_test_ci \
            tq_game_metrics_test_ci \
            tq_auth_recovery_test_ci \
            tq_archived_progress_test_ci \
            tq_screen_time_test_ci \
            tq_student_id_migration_test_ci \
            tq_website_session_migration_test_ci \
            tq_parent_route_test_ci \
            tq_student_progress_diagnostics_test_ci \
            tq_startup_safety_test_ci \
            tq_preflight_valid_test_ci \
            tq_preflight_missing_ledger_test_ci \
            tq_preflight_missing_table_test_ci \
            tq_preflight_missing_column_test_ci \
            tq_preflight_incompatible_type_test_ci \
            tq_preflight_game_student_id_width_test_ci \
            tq_preflight_malformed_ledger_test_ci \
            tq_preflight_pending_024_test_ci \
            tq_preflight_missing_receipt_constraint_test_ci; do
            docker exec tq-backend-test-postgres createdb --host=127.0.0.1 --username=postgres "$database"
          done
          disposable_sentinel="$(openssl rand -hex 24)"
          if [[ ! "$disposable_sentinel" =~ ^[a-f0-9]{48}$ ]]; then
            echo "Unable to generate the run-specific disposable PostgreSQL sentinel." >&2
            exit 1
          fi
          for database in \
            tq_backend_test_ci \
            tq_game_metrics_test_ci \
            tq_auth_recovery_test_ci \
            tq_archived_progress_test_ci \
            tq_screen_time_test_ci \
            tq_student_id_migration_test_ci \
            tq_website_session_migration_test_ci \
            tq_parent_route_test_ci \
            tq_student_progress_diagnostics_test_ci \
            tq_startup_safety_test_ci \
            tq_preflight_valid_test_ci \
            tq_preflight_missing_ledger_test_ci \
            tq_preflight_missing_table_test_ci \
            tq_preflight_missing_column_test_ci \
            tq_preflight_incompatible_type_test_ci \
            tq_preflight_game_student_id_width_test_ci \
            tq_preflight_malformed_ledger_test_ci \
            tq_preflight_pending_024_test_ci \
            tq_preflight_missing_receipt_constraint_test_ci; do
            if [[ ! "$database" =~ ^tq_[a-z0-9_]+_test_ci$ ]]; then
              echo "Refusing to mark an unrecognized PostgreSQL test database: $database" >&2
              exit 1
            fi
            docker exec tq-backend-test-postgres psql \
              --username=postgres \
              --dbname="$database" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --command "COMMENT ON DATABASE \"$database\" IS 'tq-disposable-ci:${disposable_sentinel}';" >/dev/null
          done
          echo "sentinel=${disposable_sentinel}" >> "$GITHUB_OUTPUT"
          docker inspect --format='postgres network={{.HostConfig.NetworkMode}} published-ports={{json .HostConfig.PortBindings}}' tq-backend-test-postgres

      - name: Validate operator preflight against disposable PostgreSQL
        shell: bash
        env:
          CI: 'true'
          TQ_DISPOSABLE_DB_SENTINEL: ${{ steps.start-postgres.outputs.sentinel }}
        run: node capstone/backend/scripts/run-preflight-postgres-harness.cjs

      - name: Prepare synthetic schema for backend tests without startup migrations
        shell: bash
        env:
          NODE_ENV: test
          CI: 'true'
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_backend_test_ci
          TQ_DISPOSABLE_DB_SENTINEL: ${{ steps.start-postgres.outputs.sentinel }}
          NODE_PATH: /backend-deps/node_modules
        run: |
          set -euo pipefail
          docker run --rm \
            --network container:tq-backend-test-postgres \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=2g \
            --cpus=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --volume "$GITHUB_WORKSPACE/capstone:/workspace/capstone:ro" \
            --volume "$RUNNER_TEMP/tq-backend-dependencies/node_modules:/backend-deps/node_modules:ro" \
            --workdir /workspace/capstone/backend \
            --user "$(id -u):$(id -g)" \
            --env NODE_ENV \
            --env CI \
            --env DATABASE_URL \
            --env TQ_DISPOSABLE_DB_SENTINEL \
            --env NODE_PATH \
            --env HOME=/tmp \
            node:20-bookworm node -e '
          const { Pool } = require("pg");
          const { applySyntheticTestSchema } = require("./testSupport/applySyntheticTestSchema");
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              await applySyntheticTestSchema(pool, process.env.DATABASE_URL);
              console.log("Run-marked synthetic backend schema prepared; application startup remains read-only.");
            } finally {
              await pool.end();
            }
          })().catch((error) => { console.error(error.stack || error.message); process.exitCode = 1; });
          '

      - name: Verify isolated test container networking and local PostgreSQL
        shell: bash
        env:
          NODE_ENV: test
          TQ_DISPOSABLE_DB_SENTINEL: ${{ steps.start-postgres.outputs.sentinel }}
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_backend_test_ci
          NODE_PATH: /backend-deps/node_modules
        run: |
          set -euo pipefail
          docker run --rm \
            --network container:tq-backend-test-postgres \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=2g \
            --cpus=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --volume "$GITHUB_WORKSPACE/capstone:/workspace/capstone:ro" \
            --volume "$RUNNER_TEMP/tq-backend-dependencies/node_modules:/backend-deps/node_modules:ro" \
            --workdir /workspace/capstone/backend \
            --user "$(id -u):$(id -g)" \
            --env NODE_ENV \
            --env CI \
            --env DATABASE_URL \
            --env TQ_DISPOSABLE_DB_SENTINEL \
            --env NODE_PATH \
            --env HOME=/tmp \
            node:20-bookworm node -e '
          const assert = require("node:assert/strict");
          const os = require("node:os");
          const { assertDisposablePostgresDatabase } = require("./testSafety/disposablePostgres");
          const interfaces = Object.entries(os.networkInterfaces()).flatMap(
            ([name, entries]) => (entries || []).map((entry) => ({ name, ...entry }))
          );
          const nonLoopback = interfaces.filter((entry) => !entry.internal);
          assert.equal(nonLoopback.length, 0, "unexpected non-loopback interface");
          assert.ok(process.getuid() > 0, "the test container must not run as root");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await assertDisposablePostgresDatabase({
              client,
              connectionString: process.env.DATABASE_URL,
              expectedDatabaseName: "tq_backend_test_ci",
            });
            await client.end();
            console.log("Node " + process.version + "; uid " + process.getuid() + "; only loopback interfaces; isolated PostgreSQL reachable");
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          '

      - name: Run Parent quiz-history against disposable PostgreSQL
