name: Isolated backend regression

on:
  push:
    branches:
      - codex/student-progress-child-progress-ai-refresh-20261031
    paths:
      - '.github/workflows/backend-network-isolated.yml'
      - 'capstone/backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-network-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    if: github.ref == 'refs/heads/codex/student-progress-child-progress-ai-refresh-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out candidate without persisting credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 20 on the GitHub-hosted runner
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify runner tools and prevent dotenv files entering the container
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --version | grep -Eq '^v20\.'
          docker version
          docker info --format 'Docker server {{.ServerVersion}}'
          for candidate in capstone/.env capstone/backend/.env; do
            if [[ -f "$candidate" ]]; then
              echo "::error::Unexpected dotenv file in clean checkout: $candidate"
              exit 1
            fi
          done

      - name: Prepare isolated dependency and log directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tq-backend-dependencies" "$RUNNER_TEMP/tq-backend-npm-cache" "$RUNNER_TEMP/tq-backend-logs"
          cp capstone/backend/package.json capstone/backend/package-lock.json "$RUNNER_TEMP/tq-backend-dependencies/"
          chmod 0755 "$RUNNER_TEMP/tq-backend-dependencies" "$RUNNER_TEMP/tq-backend-npm-cache" "$RUNNER_TEMP/tq-backend-logs"

      - name: Pull Node 20 and disposable PostgreSQL images during preparation
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:20-bookworm
          docker pull postgres:16-bookworm

      - name: Install backend dependencies from the committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --network bridge \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --volume "$RUNNER_TEMP/tq-backend-dependencies:/workspace" \
            --volume "$RUNNER_TEMP/tq-backend-npm-cache:/npm-cache" \
            --env HOME=/tmp/home \
            --env npm_config_cache=/npm-cache \
            --workdir /workspace \
            node:20-bookworm npm ci --no-audit --no-fund \
            > "$RUNNER_TEMP/tq-backend-logs/npm-ci.log" 2>&1
          install_status=$?
          set -e
          cat "$RUNNER_TEMP/tq-backend-logs/npm-ci.log"
          if [[ "$install_status" -ne 0 ]]; then
            exit "$install_status"
          fi
          test -d "$RUNNER_TEMP/tq-backend-dependencies/node_modules"

      - name: Start an ephemeral PostgreSQL database with no network
        shell: bash
        run: |
          set -euo pipefail
          postgres_uid="$(docker run --rm --network none postgres:16-bookworm id -u postgres)"
          postgres_gid="$(docker run --rm --network none postgres:16-bookworm id -g postgres)"
          docker run --detach \
            --name tq-backend-test-postgres \
            --network none \
            --user "${postgres_uid}:${postgres_gid}" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --shm-size=256m \
            --tmpfs "/var/lib/postgresql/data:rw,nosuid,nodev,size=1g,uid=${postgres_uid},gid=${postgres_gid},mode=0700" \
            --tmpfs "/var/run/postgresql:rw,nosuid,nodev,size=64m,uid=${postgres_uid},gid=${postgres_gid},mode=3775" \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-bookworm
          ready=false
          for attempt in $(seq 1 60); do
            container_state="$(docker inspect --format='{{.State.Status}}' tq-backend-test-postgres 2>/dev/null || true)"
            if [[ "$container_state" != running && "$container_state" != created ]]; then
              echo "PostgreSQL container stopped before readiness (state=${container_state:-missing})."
              docker inspect --format='exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' tq-backend-test-postgres || true
              docker logs tq-backend-test-postgres || true
              exit 1
            fi
            if docker exec tq-backend-test-postgres pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs tq-backend-test-postgres
            exit 1
          fi
          for database in \
            tq_backend_test_ci \
            tq_game_metrics_test_ci \
            tq_auth_recovery_test_ci \
            tq_archived_progress_test_ci; do
            docker exec tq-backend-test-postgres createdb --host=127.0.0.1 --username=postgres "$database"
          done
          docker inspect --format='postgres network={{.HostConfig.NetworkMode}} published-ports={{json .HostConfig.PortBindings}}' tq-backend-test-postgres

      - name: Verify isolated test container networking and local PostgreSQL
        shell: bash
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_backend_test_ci
          NODE_PATH: /backend-deps/node_modules
        run: |
          set -euo pipefail
          docker run --rm \
            --network container:tq-backend-test-postgres \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=2g \
            --cpus=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --volume "$GITHUB_WORKSPACE/capstone:/workspace/capstone:ro" \
            --volume "$RUNNER_TEMP/tq-backend-dependencies/node_modules:/backend-deps/node_modules:ro" \
            --workdir /workspace/capstone/backend \
            --user "$(id -u):$(id -g)" \
            --env NODE_ENV \
            --env DATABASE_URL \
            --env NODE_PATH \
            --env HOME=/tmp \
            node:20-bookworm node -e '
          const assert = require("node:assert/strict");
          const os = require("node:os");
          const interfaces = Object.entries(os.networkInterfaces()).flatMap(
            ([name, entries]) => (entries || []).map((entry) => ({ name, ...entry }))
          );
          const nonLoopback = interfaces.filter((entry) => !entry.internal);
          assert.equal(nonLoopback.length, 0, "unexpected non-loopback interface");
          assert.ok(process.getuid() > 0, "the test container must not run as root");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query("SELECT 1");
            await client.end();
            console.log("Node " + process.version + "; uid " + process.getuid() + "; only loopback interfaces; isolated PostgreSQL reachable");
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          '

      - name: Run the full backend suite in the isolated network namespace
        id: full-backend
        continue-on-error: true
        shell: bash
        env:
          NODE_ENV: test
          AI_RUNTIME_ENABLED: 'false'
          AI_GENERATION_ENABLED: 'false'
          JWT_SECRET: isolated-backend-ci-only-secret
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_backend_test_ci
          GAME_METRICS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_game_metrics_test_ci
          AUTH_RECOVERY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_auth_recovery_test_ci
          ARCHIVED_PROGRESS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_archived_progress_test_ci
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --network container:tq-backend-test-postgres \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=512 \
            --memory=7g \
            --cpus=3 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,mode=1777 \
            --volume "$GITHUB_WORKSPACE/capstone:/workspace/capstone:ro" \
            --volume "$RUNNER_TEMP/tq-backend-dependencies/node_modules:/backend-deps/node_modules:ro" \
            --workdir /workspace/capstone/backend \
            --user "$(id -u):$(id -g)" \
            --env NODE_PATH=/backend-deps/node_modules \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env TMP=/tmp \
            --env TEMP=/tmp \
            --env NODE_ENV \
            --env AI_RUNTIME_ENABLED \
            --env AI_GENERATION_ENABLED \
            --env JWT_SECRET \
            --env DATABASE_URL \
            --env GAME_METRICS_TEST_DATABASE_URL \
            --env AUTH_RECOVERY_TEST_DATABASE_URL \
            --env ARCHIVED_PROGRESS_TEST_DATABASE_URL \
            --env NO_COLOR=1 \
            node:20-bookworm node --test --test-reporter=tap \
            > "$RUNNER_TEMP/tq-backend-logs/backend-full.tap" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/tq-backend-logs/backend-full.tap"
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"
      - name: Run server.parentGameResults.test.js explicitly in the same isolation
        id: parent-game-results
        continue-on-error: true
        shell: bash
        env:
          NODE_ENV: test
          AI_RUNTIME_ENABLED: 'false'
          AI_GENERATION_ENABLED: 'false'
          JWT_SECRET: isolated-backend-ci-only-secret
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tq_backend_test_ci
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --network container:tq-backend-test-postgres \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=3g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --volume "$GITHUB_WORKSPACE/capstone:/workspace/capstone:ro" \
            --volume "$RUNNER_TEMP/tq-backend-dependencies/node_modules:/backend-deps/node_modules:ro" \
            --workdir /workspace/capstone/backend \
            --user "$(id -u):$(id -g)" \
            --env NODE_PATH=/backend-deps/node_modules \
            --env HOME=/tmp/home \
            --env TMPDIR=/tmp \
            --env TMP=/tmp \
            --env TEMP=/tmp \
            --env NODE_ENV \
            --env AI_RUNTIME_ENABLED \
            --env AI_GENERATION_ENABLED \
            --env JWT_SECRET \
            --env DATABASE_URL \
            --env NO_COLOR=1 \
            node:20-bookworm node --test --test-reporter=tap server.parentGameResults.test.js \
            > "$RUNNER_TEMP/tq-backend-logs/server-parent-game-results.tap" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/tq-backend-logs/server-parent-game-results.tap"
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Preserve isolated PostgreSQL diagnostics
        if: always()
        shell: bash
        run: |
          docker logs tq-backend-test-postgres > "$RUNNER_TEMP/tq-backend-logs/postgres.log" 2>&1 || true

      - name: Summarize backend test reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Isolated backend regression"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Runtime: Node 20 in an unprivileged container."
            echo "- Test network: shared with an ephemeral PostgreSQL container started with Docker network none; only loopback is available."
            echo "- Database: disposable PostgreSQL databases with synthetic fixtures; no production URL or data."
            echo
            echo "### Full backend suite"
            if [[ -f "$RUNNER_TEMP/tq-backend-logs/backend-full.tap" ]]; then
              tail -n 12 "$RUNNER_TEMP/tq-backend-logs/backend-full.tap"
            else
              echo "No full-suite report was produced."
            fi
            echo
            echo "### server.parentGameResults.test.js"
            if [[ -f "$RUNNER_TEMP/tq-backend-logs/server-parent-game-results.tap" ]]; then
              tail -n 12 "$RUNNER_TEMP/tq-backend-logs/server-parent-game-results.tap"
            else
              echo "No focused report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-network-isolated-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tq-backend-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable PostgreSQL container
        if: always()
        shell: bash
        run: docker rm -f tq-backend-test-postgres >/dev/null 2>&1 || true

      - name: Fail the job if either backend run failed
        if: always()
        shell: bash
        env:
          FULL_RESULT: ${{ steps.full-backend.outcome }}
          PARENT_RESULT: ${{ steps.parent-game-results.outcome }}
        run: |
          if [[ "$FULL_RESULT" != success || "$PARENT_RESULT" != success ]]; then
            echo "Full backend outcome=$FULL_RESULT; parent game-result outcome=$PARENT_RESULT"
            exit 1
          fi
