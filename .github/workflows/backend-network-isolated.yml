      - name: Summarize backend test reports
        id: backend-summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "tq-backend-logs"
          inventory_file = root / "backend-test-files.txt"
          inventory = inventory_file.read_text().splitlines() if inventory_file.exists() else []
          status_file = root / "backend-file-status.tsv"
          rows = []
          if status_file.exists():
              for line in status_file.read_text().splitlines()[1:]:
                  fields = line.split("\t")
                  if len(fields) == 3:
                      rows.append((fields[0], fields[1], fields[2]))
          file_counts = collections.Counter(result for _, result, _ in rows)
          case_counts = collections.Counter()
          partial_counts = collections.Counter()
          incomplete = []
          timed_out = []
          failed = []
          for test_file, result, _ in rows:
              report_path = root / "backend-file-tests" / (test_file.replace("/", "_") + ".tap")
              report = report_path.read_text(errors="replace") if report_path.exists() else ""
              summary = {}
              for key in ("tests", "pass", "fail", "cancelled", "skipped", "todo"):
                  matches = re.findall(r"^# " + key + r" (\d+)\s*$", report, re.MULTILINE)
                  if matches:
                      summary[key] = int(matches[-1])
              if all(key in summary for key in ("tests", "pass", "fail", "cancelled", "skipped", "todo")):
                  case_counts.update(summary)
              else:
                  if result == "timed_out":
                      timed_out.append(test_file)
                  else:
                      incomplete.append(test_file)
                  for match in re.finditer(r"^(ok|not ok)\s+\d+(?:\s+.*)?$", report, re.MULTILINE):
                      line = match.group(0)
                      if "# SKIP" in line:
                          partial_counts["skipped"] += 1
                      elif match.group(1) == "ok":
                          partial_counts["pass"] += 1
                      else:
                          partial_counts["fail"] += 1
              if result == "failed":
                  failed.append(test_file)
          recorded = {test_file for test_file, _, _ in rows}
          missing = sorted(set(inventory) - recorded)
          unexpected = sorted(recorded - set(inventory))
          parent_contract_path = root / "parent-contract.status"
          parent_pg_path = root / "parent-route-postgres.status"
          parent_contract = parent_contract_path.read_text().strip() if parent_contract_path.exists() else "not run"
          parent_pg = parent_pg_path.read_text().strip() if parent_pg_path.exists() else "not run"
          parent_tap_path = root / "server-parent-game-results.tap"
          parent_tap = parent_tap_path.read_text(errors="replace") if parent_tap_path.exists() else ""
          parent_counts = {}
          for key in ("tests", "pass", "fail", "skipped"):
              matches = re.findall(r"^# " + key + r" (\d+)\s*$", parent_tap, re.MULTILINE)
              if matches:
                  parent_counts[key] = int(matches[-1])

          lines = [
              "## Isolated backend regression",
              "",
              "- Source commit: " + os.environ.get("GITHUB_SHA", "unknown"),
              "- Runtime: Node 20 in unprivileged test containers.",
              "- Network: test containers share the disposable PostgreSQL container's Docker none network namespace; only loopback is available and no ports are published.",
              "- Data: synthetic fixtures in disposable PostgreSQL databases; no production credentials or services are passed into test containers.",
              "- Independent Parent PostgreSQL route probe: **" + parent_pg + "**",
              "- Independent server.parentGameResults.test.js contract suite: **" + parent_contract + "**",
              "",
              "### Full backend test files",
              "- Tracked test files: **" + str(len(inventory)) + "**",
              "- Passed files: **" + str(file_counts["passed"]) + "**",
              "- Failed files: **" + str(file_counts["failed"]) + "**",
              "- Timed-out files: **" + str(file_counts["timed_out"]) + "**",
              "- Other runner errors: **" + str(sum(value for key, value in file_counts.items() if key not in {"passed", "failed", "timed_out"})) + "**",
              "- Missing status rows: **" + str(len(missing)) + "**",
              "",
              "### Complete TAP case totals",
              "- Passed: **" + str(case_counts["pass"]) + "**",
              "- Failed: **" + str(case_counts["fail"]) + "**",
              "- Skipped: **" + str(case_counts["skipped"]) + "**",
              "- Cancelled: **" + str(case_counts["cancelled"]) + "**",
              "- Todo: **" + str(case_counts["todo"]) + "**",
              "- Total cases from complete TAP reports: **" + str(case_counts["tests"]) + "**",
              "- Case totals above include only files with a complete TAP summary; timed-out files are listed separately.",
              "",
              "### Partial TAP observations from incomplete files",
              "- Passed status lines observed: **" + str(partial_counts["pass"]) + "**",
              "- Failed status lines observed: **" + str(partial_counts["fail"]) + "**",
              "- Skipped status lines observed: **" + str(partial_counts["skipped"]) + "**",
              "- Timed-out files: " + (", ".join(timed_out) if timed_out else "none"),
              "",
              "### Parent route PostgreSQL verification",
              "The workflow-generated probe seeds only synthetic accounts, sessions, and game results in the disposable tq_parent_route_test_ci database, then calls the real Parent quiz-history HTTP route and checks current-cycle filtering plus unrelated-Parent and Student-role rejection.",
              "",
              "### Full-suite diagnostics",
              "- Every tracked test file runs sequentially with a 30-second limit plus a 5-second termination grace. Each file start is logged; TAP output is streamed and stored separately.",
              "- Failed files: " + (", ".join(failed) if failed else "none"),
              "- Incomplete non-timeout reports: " + (", ".join(incomplete) if incomplete else "none"),
              "- Missing inventory rows: " + (", ".join(missing) if missing else "none"),
              "- Unexpected inventory rows: " + (", ".join(unexpected) if unexpected else "none"),
          ]
          if parent_counts:
              lines.extend([
                  "",
                  "### Independent mocked Parent contract TAP counts",
                  "- Passed: **" + str(parent_counts.get("pass", 0)) + "**; failed: **" + str(parent_counts.get("fail", 0)) + "**; skipped: **" + str(parent_counts.get("skipped", 0)) + "**; total: **" + str(parent_counts.get("tests", 0)) + "**.",
              ])
          summary_text = "\n".join(lines) + "\n"
          print(summary_text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary_text)
          PY

      - name: Upload backend logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-network-isolated-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tq-backend-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable PostgreSQL container
        if: always()
        shell: bash
        run: docker rm -f tq-backend-test-postgres >/dev/null 2>&1 || true

      - name: Fail the job if any backend verification failed
        if: always()
        shell: bash
        env:
          FULL_RESULT: ${{ steps.full-backend.outcome }}
          PARENT_RESULT: ${{ steps.parent-game-results.outcome }}
        run: |
          if [[ "$FULL_RESULT" != success || "$PARENT_RESULT" != success ]]; then
            echo "Full backend outcome=$FULL_RESULT; parent game-result outcome=$PARENT_RESULT"
            exit 1
          fi
          if [[ "$(cat "$RUNNER_TEMP/tq-backend-logs/parent-route-postgres.status" 2>/dev/null || true)" != passed ]]; then
            echo "The Parent PostgreSQL route integration probe did not pass."
            exit 1
          fi
          if [[ "$(cat "$RUNNER_TEMP/tq-backend-logs/parent-contract.status" 2>/dev/null || true)" != passed ]]; then
            echo "The independent Parent contract test did not pass."
            exit 1
          fi
          inventory_count="$(wc -l < "$RUNNER_TEMP/tq-backend-logs/backend-test-files.txt" 2>/dev/null || echo 0)"
          status_count="$(awk 'END { if (NR > 0) print NR - 1; else print 0 }' "$RUNNER_TEMP/tq-backend-logs/backend-file-status.tsv" 2>/dev/null || echo 0)"
          if [[ "$inventory_count" -eq 0 || "$status_count" -ne "$inventory_count" ]]; then
            echo "Backend test-file inventory incomplete: expected=$inventory_count reported=$status_count"
            exit 1
          fi
          if awk -F '\t' 'NR > 1 && $2 != "passed" { failed = 1 } END { exit failed ? 0 : 1 }' "$RUNNER_TEMP/tq-backend-logs/backend-file-status.tsv"; then
            echo "At least one backend test file failed or timed out."
            exit 1
          fi
