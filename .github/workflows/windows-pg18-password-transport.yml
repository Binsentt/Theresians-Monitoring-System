name: Windows PostgreSQL 18 password transport

on:
  push:
    branches:
      - codex/p0-windows-password-transport-20261127
    paths:
      - .github/workflows/windows-pg18-password-transport.yml
      - capstone/backend/scripts/Pg18SyntheticPasswordWorker.cs
      - capstone/backend/scripts/windowsPg18PasswordTransport.integration.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-password-transport:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download verified PostgreSQL 18.6 Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64-binaries.zip'
          $expected = 'E2246BA91D22345BC3D017586C09EDE52D9DF180B1EEB480F050445F1CAD84E2'
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-18.6-5-windows-x64-binaries.zip'
          $target = Join-Path $env:RUNNER_TEMP 'tq-pg18-binaries'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expected) {
            throw 'PostgreSQL 18.6 archive digest mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $bin = Join-Path $target 'pgsql\bin'
          foreach ($file in @('initdb.exe','pg_ctl.exe','psql.exe','libpq.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $file) -PathType Leaf)) {
              throw 'PostgreSQL 18.6 archive is incomplete.'
            }
          }
          $version = & (Join-Path $bin 'psql.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^psql \(PostgreSQL\) 18\.6\b') {
            throw 'Unexpected PostgreSQL client version.'
          }
          "TQ_PG18_BIN=$bin" >> $env:GITHUB_ENV
          Write-Output 'VERIFIED_POSTGRESQL_18_6_BINARIES=PASS'
      - name: Compile synthetic libpq worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'capstone\backend\scripts\Pg18SyntheticPasswordWorker.cs'
          $output = Join-Path $env:TQ_PG18_BIN 'Pg18SyntheticPasswordWorker.exe'
          Add-Type -Path $source -OutputAssembly $output -OutputType ConsoleApplication -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'Synthetic worker compilation failed.'
          }
          Write-Output 'SYNTHETIC_WORKER_COMPILATION=PASS'
      - name: Prove synthetic PostgreSQL 18 password transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node capstone/backend/scripts/windowsPg18PasswordTransport.integration.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic password transport failed.' }
